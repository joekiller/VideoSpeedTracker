name: macOS

# macOS build, tests and packages: Apple clang, ctest under macOS's bash 3.2 and BSD tools, VSTStudio.app staged
# (Info.plist, icon, ad-hoc signature), the .tar.gz and the .dmg. One file serves both uses, so a pull request checks
# exactly what a release builds:
#   - pull requests run it directly, only when they touch files the Mac package builds from (Windows-only packaging
#     doesn't start it), so Mac-only breaks (libc++'s missing standard headers, bash 3.2 in scripts and test fakes,
#     .mm code, the .app bundle) show up on the PR.
#   - release.yml calls it for main pushes, tags and manual runs. Only a tag build signs and notarizes (Apple secrets
#     in the `release` environment); a PR has no tag, so nothing is signed, notarized or published.
# A PR that touches none of these files gets no run at all, so don't make it a required check.

on:
  pull_request:
    paths:
      - .github/workflows/macos.yml
      - CMakeLists.txt
      - bin/**
      - cmake/**
      - packaging/build-*.sh
      - packaging/macos-*
      - packaging/vst-studio.png
      - sampleData/**
      - src/**
      - tests/**
  # release.yml calls this for every main push, tag and manual run, passing its version.
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

# A new push to a PR cancels its running check. Called from release.yml the run belongs to the release, whose own
# concurrency group applies; this group (named after this file, not the release) never matches the release's.
concurrency:
  group: macos-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # macos-latest follows GitHub's current Apple-silicon image, so macOS retirements need no edits here (the
  # package is built against Homebrew's OpenCV of the day either way). Linux and Windows stay pinned: their
  # .deb dependencies and MSVC toolset are tied to the image.
  build:
    name: build + tests + app
    runs-on: macos-latest
    # The Apple secrets live in the `release` environment, which only tag builds enter (same rule as windows);
    # without it secrets.* resolve empty and SIGN_MACOS is false even on a tag.
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    env:
      # The release passes its version (1.2.3, or 0.0.0~abc1234 off a tag); a pull request's build is 0.0.0~pr<number>.
      VST_VERSION: ${{ inputs.version || format('0.0.0~pr{0}', github.event.pull_request.number) }}
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      # Not HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: Homebrew answers it with a ##[warning] annotation on every run.
      # Developer ID signing + notarization runs on tag builds once the Apple secrets are set (see
      # docs/code-signing.md); without them the binaries keep the linker's ad-hoc signature.
      # Unpublished main and manual builds skip it rather than wait on Apple's notary service.
      SIGN_MACOS: ${{ github.ref_type == 'tag' && secrets.MACOS_CERT_P12_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenCV
        # Homebrew has no retry option, so a failed bottle download gets two more tries.
        run: for i in 1 2 3; do brew install opencv && exit 0; sleep $((i * 15)); done; exit 1
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix opencv)" \
                -DVST_VERSION=${{ env.VST_VERSION }}
          cmake --build build -j"$(sysctl -n hw.ncpu)"
      - name: Sample video regression test
        run: ctest --test-dir build --output-on-failure -j"$(sysctl -n hw.ncpu)"
      # Links against Homebrew's OpenCV dylibs rather than bundling them (that would drag in
      # FFmpeg and most of its codec stack), so the archive is for machines with Homebrew.
      - name: Stage package
        run: |
          name="VideoSpeedTracker-${{ env.VST_VERSION }}-macos-arm64"
          echo "PKG_NAME=$name" >> "$GITHUB_ENV"
          cmake --install build --prefix "pkg/$name"
          printf 'Requires Homebrew OpenCV 5:  brew install opencv\n' > "pkg/$name/REQUIREMENTS.txt"
          # VST Studio ships as VSTStudio.app: Gatekeeper won't pass a double-clicked bare executable even when it's
          # notarized, and only a bundle can carry a stapled ticket. Its resources (companion, sample, VST.cfg
          # template) go inside the bundle, because a quarantined app is translocated alone on first launch; the
          # command-line tools beside it find the sample there too (userpaths::installedFile).
          app="pkg/$name/VSTStudio.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources"
          mv "pkg/$name/VSTStudio" "$app/MacOS/"
          mv "pkg/$name/companion" "pkg/$name/sample" "$app/Resources/"
          cp "pkg/$name/VST.cfg" "$app/Resources/"
          sed 's/@VERSION@/${{ env.VST_VERSION }}/g' packaging/macos-Info.plist > "$app/Info.plist"
          plutil -lint "$app/Info.plist"
          iconset="$RUNNER_TEMP/VSTStudio.iconset"
          mkdir -p "$iconset"
          for s in 16 32 128 256; do
            sips -z $s $s packaging/vst-studio.png --out "$iconset/icon_${s}x${s}.png" >/dev/null
            if [ $s -le 128 ]; then
              sips -z $((s * 2)) $((s * 2)) packaging/vst-studio.png --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
            fi
          done
          iconutil -c icns "$iconset" -o "$app/Resources/VSTStudio.icns"
          # Seal the bundle (Info.plist and resources) with an ad-hoc signature; tag builds re-sign it below.
          codesign --force --sign - "pkg/$name/VSTStudio.app"
      # Hardened runtime is required for notarization; the entitlements let it load Homebrew's
      # OpenCV dylibs, which aren't signed by our team, and use the camera. The ticket is stapled to
      # VSTStudio.app so it opens offline; the bare command-line tools can't be stapled, so Gatekeeper
      # looks theirs up online the first time they run.
      - name: Sign and notarize
        if: env.SIGN_MACOS == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(uuidgen)"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"   # the disk image is signed with it after packaging
          # Signing the bundle signs Contents/MacOS/VSTStudio and seals Info.plist and Resources with it.
          for exe in VideoSpeedTracker ProcessHiLites VSTStudio.app; do
            codesign --force --timestamp --options runtime \
              --entitlements packaging/macos-entitlements.plist \
              --sign "Developer ID Application" --keychain "$keychain" "pkg/$PKG_NAME/$exe"
            codesign --verify --deep --strict --verbose=2 "pkg/$PKG_NAME/$exe"
          done
          ditto -c -k --keepParent "pkg/$PKG_NAME" "$RUNNER_TEMP/notarize.zip"
          # notarytool exits 0 on an Invalid verdict too, so check the status it reports.
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait --output-format json \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" | tee "$RUNNER_TEMP/notary.json"
          grep -q '"status" *: *"Accepted"' "$RUNNER_TEMP/notary.json"
          xcrun stapler staple "pkg/$PKG_NAME/VSTStudio.app"
          # What a user's Mac will decide: the app must read "accepted, source=Notarized Developer ID". The tools'
          # verdict depends on an online ticket lookup, so it's printed for the log rather than gating the release.
          spctl --assess --type execute --verbose=4 "pkg/$PKG_NAME/VSTStudio.app"
          for exe in VideoSpeedTracker ProcessHiLites; do
            spctl --assess --type install --verbose=4 "pkg/$PKG_NAME/$exe" || true
          done
      # The disk image is built from the already signed and stapled files, so the app inside it opens
      # offline; Applications is a symlink to drag VSTStudio.app onto (it carries everything it needs).
      - name: Tar and disk image
        run: |
          name="$PKG_NAME"
          mkdir dist
          tar -C pkg -czf "dist/$name.tar.gz" "$name"
          otool -L "pkg/$name/VideoSpeedTracker"
          dmgroot="$RUNNER_TEMP/dmgroot"
          ditto "pkg/$name" "$dmgroot"
          ln -s /Applications "$dmgroot/Applications"
          hdiutil create -volname "VideoSpeedTracker ${{ env.VST_VERSION }}" -srcfolder "$dmgroot" \
            -fs HFS+ -format UDZO -ov "dist/$name.dmg"
      # A second notarization, of the image itself, so its ticket can be stapled to the .dmg too.
      - name: Sign and notarize the disk image
        if: env.SIGN_MACOS == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          dmg="dist/$PKG_NAME.dmg"
          codesign --force --timestamp --sign "Developer ID Application" --keychain "$KEYCHAIN" "$dmg"
          xcrun notarytool submit "$dmg" --wait --output-format json \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" | tee "$RUNNER_TEMP/notary-dmg.json"
          grep -q '"status" *: *"Accepted"' "$RUNNER_TEMP/notary-dmg.json"
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          security delete-keychain "$KEYCHAIN"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos-arm64
          path: dist/*
          retention-days: 7    # tag builds publish to the release; the artifact is only a hand-off
          compression-level: 0 # .deb/.zip/.tar.gz are compressed already; deflating them again only costs time
