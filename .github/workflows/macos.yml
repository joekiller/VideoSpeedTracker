name: macOS

# macOS build, tests and packages: Apple clang, ctest under macOS's bash 3.2 and BSD tools, VSTStudio.app staged
# (Info.plist, icon, ad-hoc signature), the .tar.gz and the .dmg. One file serves both uses, so a pull request checks
# exactly what a release builds:
#   - pull requests run it directly, only when they touch files the Mac package builds from (Windows-only packaging
#     doesn't start it), so Mac-only breaks (libc++'s missing standard headers, bash 3.2 in scripts and test fakes,
#     .mm code, the .app bundle) show up on the PR.
#   - release.yml calls it for main pushes, tags and manual runs. Only a tag build signs and notarizes (Apple secrets
#     in the `release` environment); a PR has no tag, so nothing is signed, notarized or published.
# A PR that touches none of these files gets no run at all, so don't make it a required check.

on:
  pull_request:
    paths:
      - .github/workflows/macos.yml
      - CMakeLists.txt
      - bin/**
      - cmake/**
      - packaging/build-*.sh
      - packaging/macos-*
      - packaging/vst-studio.png
      - sampleData/**
      - src/**
      - tests/**
  # release.yml calls this for every main push, tag and manual run, passing its version.
  workflow_call:
    inputs:
      version:
        type: string
        required: true

permissions:
  contents: read

# A new push to a PR cancels its running check. Called from release.yml the run belongs to the release, whose own
# concurrency group applies; this group (named after this file, not the release) never matches the release's.
concurrency:
  group: macos-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # macos-latest follows GitHub's current Apple-silicon image, so macOS retirements need no edits here (the app is
  # compiled for MACOSX_DEPLOYMENT_TARGET whatever the image's macOS). Linux and Windows stay pinned: their
  # .deb dependencies and MSVC toolset are tied to the image.
  build:
    name: build + tests + app
    runs-on: macos-latest
    # The Apple secrets live in the `release` environment, which only tag builds enter (same rule as windows);
    # without it secrets.* resolve empty and SIGN_MACOS is false even on a tag.
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    env:
      # The release passes its version (1.2.3, or 0.0.0~abc1234 off a tag); a pull request's build is 0.0.0~pr<number>.
      VST_VERSION: ${{ inputs.version || format('0.0.0~pr{0}', github.event.pull_request.number) }}
      # The oldest macOS the app opens on (also LSMinimumSystemVersion in packaging/macos-Info.plist). FFmpeg,
      # OpenCV and VST are all compiled for it; without it everything would target the runner's own macOS.
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      # Developer ID signing + notarization runs on tag builds once the Apple secrets are set (see
      # docs/code-signing.md); without them the binaries keep the linker's ad-hoc signature.
      # Unpublished main and manual builds skip it rather than wait on Apple's notary service.
      SIGN_MACOS: ${{ github.ref_type == 'tag' && secrets.MACOS_CERT_P12_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      # Nothing from Homebrew ends up in the app, so it opens on a Mac without Homebrew. OpenCV is static, as on Linux
      # and Windows; videoio reads files and streams through a small LGPL FFmpeg (packaging/build-ffmpeg.sh) whose
      # five dylibs ship in Contents/Frameworks. Both are cached together; a change to either script rebuilds both.
      # build-opencv.sh needs no macOS options: on Apple OpenCV builds its own zlib/libpng/libjpeg by default, and
      # PKG_CONFIG_LIBDIR (which replaces pkg-config's default search path, Homebrew's included) lets it find only
      # this FFmpeg.
      - name: Cache FFmpeg and OpenCV
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: ~/opt
          key: macos-arm64-${{ env.MACOSX_DEPLOYMENT_TARGET }}-ffmpeg-opencv-5.0.0-${{ hashFiles('packaging/build-ffmpeg.sh', 'packaging/build-opencv.sh') }}
      - name: Build FFmpeg and OpenCV
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          # OpenCV finds FFmpeg only through pkg-config (a build tool here; nothing of it ships).
          command -v pkg-config >/dev/null || brew install pkgconf
          packaging/build-ffmpeg.sh "$HOME/opt/ffmpeg"
          PKG_CONFIG_LIBDIR="$HOME/opt/ffmpeg/lib/pkgconfig" packaging/build-opencv.sh "$HOME/opt/opencv"
          # Without FFmpeg, videoio could still open cameras (AVFoundation) but no video file or stream: stop here.
          grep -q "$HOME/opt/ffmpeg/lib/libavcodec" "$HOME/opt/opencv/lib/cmake/opencv5/OpenCVModules.cmake"
      # Test tool only: the stream tests (live_stream_reconnect, picam) feed VST through the ffmpeg command, which
      # CMake looks for at configure time. Installed after OpenCV is built, and the bundle check in Stage package
      # fails the job if anything in the app ends up linking Homebrew.
      - name: Install ffmpeg for the stream tests
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        # Homebrew has no retry option, so a failed bottle download gets two more tries.
        run: for i in 1 2 3; do brew install ffmpeg && exit 0; sleep $((i * 15)); done; exit 1
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$HOME/opt/opencv" \
                -DVST_VERSION=${{ env.VST_VERSION }}
          cmake --build build -j"$(sysctl -n hw.ncpu)"
      - name: Sample video regression test
        run: ctest --test-dir build --output-on-failure -j"$(sysctl -n hw.ncpu)"
      - name: Stage package
        run: |
          name="VideoSpeedTracker-${{ env.VST_VERSION }}-macos-arm64"
          echo "PKG_NAME=$name" >> "$GITHUB_ENV"
          # The package is a single VSTStudio.app: the disk image shows it beside an Applications link and
          # nothing else, so installing is one drag and opening it starts the GUI. Everything `cmake --install`
          # lays out goes inside the bundle:
          #   Contents/MacOS/      VSTStudio (CFBundleExecutable, what Finder launches) plus the command-line tools
          #                        VideoSpeedTracker and ProcessHiLites, for power users (README "macOS")
          #   Contents/Frameworks/ the FFmpeg dylibs all three load through @executable_path/../Frameworks
          #   Contents/Resources/  VST.cfg / ProcessHiLites.cfg templates, companion, sample, README.md,
          #                        GETTING-STARTED.md, LICENSE.txt, licenses/ (OpenCV, FFmpeg, GUI libs) and the icon
          # A bundle rather than a bare executable because Gatekeeper won't pass a double-clicked bare executable
          # even when it's notarized, and only a bundle can carry a stapled ticket. Keeping the resources inside
          # matters too: a quarantined app is translocated alone on first launch. Every program finds its files
          # through Contents/MacOS/../Resources (userpaths::installedFile) and copies the cfg templates to
          # ~/Library/Application Support/VideoSpeedTracker on first run, so nothing writes into the signed bundle.
          inst="$RUNNER_TEMP/install"
          cmake --install build --prefix "$inst"
          app="pkg/$name/VSTStudio.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources"
          for exe in VSTStudio VideoSpeedTracker ProcessHiLites; do mv "$inst/$exe" "$app/MacOS/"; done
          # Each FFmpeg library under the file name its install name gives (@rpath/libavcodec.61.dylib), the
          # symlink chain flattened to one real file. Its LGPL text and exact source go with the other notices.
          ffmpeg="$HOME/opt/ffmpeg"
          mkdir -p "$app/Frameworks"
          for lib in "$ffmpeg"/lib/lib*.dylib; do
            id="$(otool -D "$lib" | tail -n 1)"
            cp -L "$ffmpeg/lib/${id#@rpath/}" "$app/Frameworks/${id#@rpath/}"
          done
          cp -R "$ffmpeg/share/licenses/ffmpeg" "$inst/licenses/ffmpeg"
          # What's left is data (cfgs, companion, sample, docs, licenses); a stray Mach-O here would break signing.
          mv "$inst"/* "$app/Resources/"
          rmdir "$inst"
          sed 's/@VERSION@/${{ env.VST_VERSION }}/g' packaging/macos-Info.plist > "$app/Info.plist"
          plutil -lint "$app/Info.plist"
          iconset="$RUNNER_TEMP/VSTStudio.iconset"
          mkdir -p "$iconset"
          for s in 16 32 128 256; do
            sips -z $s $s packaging/vst-studio.png --out "$iconset/icon_${s}x${s}.png" >/dev/null
            if [ $s -le 128 ]; then
              sips -z $((s * 2)) $((s * 2)) packaging/vst-studio.png --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
            fi
          done
          iconutil -c icns "$iconset" -o "$app/Resources/VSTStudio.icns"
          # Seal the bundle (Info.plist and resources) with an ad-hoc signature; tag builds re-sign it below.
          # Every Mach-O may load only system libraries and the bundle's own Frameworks: a path into Homebrew or this
          # runner would work here and crash on a user's Mac, so it fails the build instead.
          bad=0
          for macho in "$app"/MacOS/* "$app"/Frameworks/*.dylib; do
            while read -r dep _; do
              case "$dep" in
                /usr/lib/*|/System/*) ;;
                @rpath/*) [ -f "$app/Frameworks/${dep#@rpath/}" ] || { echo "::error::$macho needs $dep, not in Frameworks"; bad=1; } ;;
                *) echo "::error::$macho links $dep from outside the app"; bad=1 ;;
              esac
            done < <(otool -L "$macho" | tail -n +2)
          done
          [ "$bad" = 0 ]
          otool -l "$app/MacOS/VideoSpeedTracker" | grep -A2 LC_RPATH
          # Nested code is signed inside-out, each piece before whatever seals it: Frameworks, then the tools in
          # Contents/MacOS, then the bundle.
          for code in "$app"/Frameworks/*.dylib "$app/MacOS/VideoSpeedTracker" "$app/MacOS/ProcessHiLites"; do
            codesign --force --sign - "$code"
          done
          codesign --force --sign - "pkg/$name/VSTStudio.app"
          codesign --verify --strict --verbose=2 "pkg/$name/VSTStudio.app"
          # The package must hold the app and nothing else (the disk image adds only the Applications link).
          test "$(ls -A "pkg/$name")" = VSTStudio.app
      # Hardened runtime is required for notarization; the entitlements let the programs use the camera (and keep
      # library validation relaxed, see packaging/macos-entitlements.plist). The command-line tools inside the
      # bundle are signed first (inside-out, no --deep), so the one notarization covers them and the ticket
      # stapled to VSTStudio.app lets it open offline.
      - name: Sign and notarize
        if: env.SIGN_MACOS == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(uuidgen)"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"   # the disk image is signed with it after packaging
          # Inside-out: the nested tools first, then the bundle, which signs Contents/MacOS/VSTStudio and seals
          # Info.plist, Resources and the tools' signatures with it.
          app="pkg/$PKG_NAME/VSTStudio.app"
          for code in "$app"/Contents/Frameworks/*.dylib "$app/Contents/MacOS/VideoSpeedTracker" \
                      "$app/Contents/MacOS/ProcessHiLites" "$app"; do
            codesign --force --timestamp --options runtime \
              --entitlements packaging/macos-entitlements.plist \
              --sign "Developer ID Application" --keychain "$keychain" "$code"
          done
          codesign --verify --deep --strict --verbose=2 "$app"
          ditto -c -k --keepParent "pkg/$PKG_NAME" "$RUNNER_TEMP/notarize.zip"
          # notarytool exits 0 on an Invalid verdict too, so check the status it reports.
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait --output-format json \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" | tee "$RUNNER_TEMP/notary.json"
          grep -q '"status" *: *"Accepted"' "$RUNNER_TEMP/notary.json"
          xcrun stapler staple "pkg/$PKG_NAME/VSTStudio.app"
          # What a user's Mac will decide: the app must read "accepted, source=Notarized Developer ID".
          spctl --assess --type execute --verbose=4 "pkg/$PKG_NAME/VSTStudio.app"
      # The disk image is built from the already signed and stapled files, so the app inside it opens
      # offline. The image holds VSTStudio.app and an Applications symlink to drag it onto, nothing else: the app
      # carries the tools, templates, docs and licenses itself.
      - name: Tar and disk image
        run: |
          name="$PKG_NAME"
          mkdir dist
          tar -C pkg -czf "dist/$name.tar.gz" "$name"
          otool -L "pkg/$name/VSTStudio.app/Contents/MacOS/VideoSpeedTracker"
          dmgroot="$RUNNER_TEMP/dmgroot"
          ditto "pkg/$name" "$dmgroot"
          ln -s /Applications "$dmgroot/Applications"
          hdiutil create -volname "VideoSpeedTracker ${{ env.VST_VERSION }}" -srcfolder "$dmgroot" \
            -fs HFS+ -format UDZO -ov "dist/$name.dmg"
      # A second notarization, of the image itself, so its ticket can be stapled to the .dmg too.
      - name: Sign and notarize the disk image
        if: env.SIGN_MACOS == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          dmg="dist/$PKG_NAME.dmg"
          codesign --force --timestamp --sign "Developer ID Application" --keychain "$KEYCHAIN" "$dmg"
          xcrun notarytool submit "$dmg" --wait --output-format json \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" | tee "$RUNNER_TEMP/notary-dmg.json"
          grep -q '"status" *: *"Accepted"' "$RUNNER_TEMP/notary-dmg.json"
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          security delete-keychain "$KEYCHAIN"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos-arm64
          path: dist/*
          retention-days: 7    # tag builds publish to the release; the artifact is only a hand-off
          compression-level: 0 # .deb/.zip/.tar.gz are compressed already; deflating them again only costs time
