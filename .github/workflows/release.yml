# Builds every release binary and attaches it to a GitHub release.
#
# Cut a release by pushing a version tag:   git tag v1.0.0 && git push origin v1.0.0
# (or create the release in the GitHub UI with a new v* tag; that pushes the tag too).
# The release is created with generated notes if it doesn't exist yet, otherwise the
# assets are uploaded to it, replacing any with the same name.
#
# Pull requests that touch the build run everything except the publish step, so a broken
# platform shows up before the tag does. Manual runs (workflow_dispatch) do the same on a
# branch, and publish when started on a tag.
#
# Every package holds VideoSpeedTracker and ProcessHiLites plus their sample configs.
# Outputs (all built against the platform's own OpenCV 4 and checked with the sample-video ctest):
#   videospeedtracker_<ver>_<distro>_<arch>.deb  Debian 12/13 (incl. Raspberry Pi OS) and Ubuntu 24.04,
#                                                amd64 + arm64; apt pulls in the matching OpenCV runtime
#   VideoSpeedTracker-<ver>-windows-x64.zip      exes + OpenCV/FFmpeg/MSVC runtime DLLs and their licenses
#   VideoSpeedTracker-<ver>-macos-arm64.tar.gz   needs `brew install opencv`
#   SHA256SUMS
# Each package also gets a GitHub artifact attestation (Sigstore-signed build provenance).
name: release

on:
  push:
    tags: ['v[0-9]*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - CMakeLists.txt
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes its running build; tag builds always finish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      # Tag builds are versioned from the tag (v1.2.3 -> 1.2.3); anything else gets a
      # dpkg-sortable pre-release version (0.0.0~abc1234) and is never published.
      - id: v
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${version:-0.0.0~${GITHUB_SHA::7}}" >> "$GITHUB_OUTPUT"

  linux:
    needs: meta
    name: linux ${{ matrix.distro }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # One .deb per distro release because each ships a different OpenCV soname
        # (bookworm 4.6, trixie 4.10, noble 4.6 after the t64 rename). arm64 builds run
        # natively on GitHub's arm runners and cover 64-bit Raspberry Pi OS.
        distro: [debian-bookworm, debian-trixie, ubuntu-24.04]
        arch: [amd64, arm64]
        include:
          - distro: debian-bookworm
            image: debian:bookworm
          - distro: debian-trixie
            image: debian:trixie
          - distro: ubuntu-24.04
            image: ubuntu:24.04
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Install toolchain and OpenCV
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates git cmake make g++ dpkg-dev file libopencv-dev
      - uses: actions/checkout@v5
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVST_VERSION=${{ needs.meta.outputs.version }}
          cmake --build build -j"$(nproc)"
      - name: Sample video regression test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: |
          (cd build && cpack -G DEB)
          mkdir dist
          cp build/videospeedtracker_*.deb \
             "dist/videospeedtracker_${{ needs.meta.outputs.version }}_${{ matrix.distro }}_${{ matrix.arch }}.deb"
          dpkg-deb --info dist/*.deb
      - uses: actions/upload-artifact@v5
        with:
          name: dist-linux-${{ matrix.distro }}-${{ matrix.arch }}
          path: dist/*

  windows:
    needs: meta
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write      # OIDC login to Azure for Artifact Signing
    env:
      # Authenticode signing runs only once the Azure Artifact Signing secrets/variables are set
      # (see "Code signing" in README.md); without them the zip ships unsigned as before.
      SIGN_WINDOWS: ${{ secrets.AZURE_CLIENT_ID != '' && vars.AZURE_SIGNING_ACCOUNT != '' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
      # Official OpenCV Windows build: a single opencv_world DLL plus the FFmpeg plugin DLL.
      - name: Install OpenCV
        run: |
          choco install opencv -y --no-progress
          $bin = (Get-ChildItem C:\tools\opencv\build\x64\vc*\bin | Select-Object -Last 1).FullName
          "OPENCV_BIN=$bin" | Out-File -Append $env:GITHUB_ENV
          $bin | Out-File -Append $env:GITHUB_PATH
      - name: Build
        run: |
          cmake -S . -B build -A x64 -DOpenCV_DIR=C:/tools/opencv/build -DVST_VERSION=${{ needs.meta.outputs.version }}
          cmake --build build --config Release
      - name: Sample video regression test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage package
        run: |
          $name = "VideoSpeedTracker-${{ needs.meta.outputs.version }}-windows-x64"
          "PKG_NAME=$name" | Out-File -Append $env:GITHUB_ENV
          cmake --install build --config Release --prefix "pkg/$name"
          # Release DLLs only (the debug ones end in d.dll).
          Get-ChildItem $env:OPENCV_BIN -Filter *.dll |
            Where-Object { $_.Name -match '^opencv_(world\d+|videoio_ffmpeg\d+_64)\.dll$' } |
            Copy-Item -Destination "pkg/$name"
          # Third-party notices for what the zip redistributes: OpenCV (Apache-2.0) and the libraries
          # inside its DLLs, including FFmpeg (LGPL-2.1) in opencv_videoio_ffmpeg.
          $lic = New-Item -ItemType Directory "pkg/$name/licenses/opencv"
          # Top-level LICENSE of the extracted package (opencv\, opencv\build\ or opencv\sources\ depending on version).
          $opencvLicense = Get-ChildItem C:\tools\opencv -Recurse -Depth 1 -File -Filter LICENSE* | Select-Object -First 1
          if (-not $opencvLicense) { throw "OpenCV LICENSE not found under C:\tools\opencv" }
          Copy-Item $opencvLicense "$lic/LICENSE.txt"
          Copy-Item C:\tools\opencv\build\etc\licenses\* $lic -ErrorAction Stop
          Get-ChildItem $lic
      - name: Azure login
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # Signs only our two exes; the OpenCV DLLs are third-party and the MSVC runtime is Microsoft-signed.
      - name: Authenticode-sign the executables
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\pkg\${{ env.PKG_NAME }}
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Zip
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path "pkg/$env:PKG_NAME" -DestinationPath "dist/$env:PKG_NAME.zip"
          Get-ChildItem -Recurse pkg
          Get-AuthenticodeSignature "pkg/$env:PKG_NAME/*.exe" | Format-Table Status, Path -AutoSize
      - uses: actions/upload-artifact@v5
        with:
          name: dist-windows-x64
          path: dist/*

  # macOS runners can sit queued far longer than the others (GitHub's macOS pool is small), so
  # this job doesn't gate the release: it starts once publish has run (or been skipped on PRs)
  # and adds its tarball and checksum to the existing release on its own.
  # macos-latest is the current Apple-silicon image; macos-14 is retired on 2026-11-02.
  macos:
    permissions:
      contents: write
      id-token: write      # Sigstore signing for the provenance attestation
      attestations: write
    needs: [meta, publish]
    if: always() && needs.meta.result == 'success' && needs.publish.result != 'failure'
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      # Developer ID signing + notarization runs only once the Apple secrets are set (see
      # "Code signing" in README.md); without them the binaries keep the linker's ad-hoc signature.
      SIGN_MACOS: ${{ secrets.MACOS_CERT_P12_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Install OpenCV
        run: brew install opencv
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix opencv)" \
                -DVST_VERSION=${{ needs.meta.outputs.version }}
          cmake --build build -j"$(sysctl -n hw.ncpu)"
      - name: Sample video regression test
        run: ctest --test-dir build --output-on-failure
      # Links against Homebrew's OpenCV dylibs rather than bundling them (that would drag in
      # FFmpeg and most of its codec stack), so the archive is for machines with Homebrew.
      - name: Stage package
        run: |
          name="VideoSpeedTracker-${{ needs.meta.outputs.version }}-macos-arm64"
          echo "PKG_NAME=$name" >> "$GITHUB_ENV"
          cmake --install build --prefix "pkg/$name"
          printf 'Requires Homebrew OpenCV:  brew install opencv\n' > "pkg/$name/REQUIREMENTS.txt"
      # Hardened runtime is required for notarization; the entitlement lets it load Homebrew's
      # OpenCV dylibs, which aren't signed by our team. Bare executables can't be stapled, so
      # Gatekeeper looks the notarization ticket up online on first launch.
      - name: Sign and notarize
        if: env.SIGN_MACOS == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(uuidgen)"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          for exe in VideoSpeedTracker ProcessHiLites; do
            codesign --force --timestamp --options runtime \
              --entitlements packaging/macos-entitlements.plist \
              --sign "Developer ID Application" --keychain "$keychain" "pkg/$PKG_NAME/$exe"
            codesign --verify --strict --verbose=2 "pkg/$PKG_NAME/$exe"
          done
          ditto -c -k --keepParent "pkg/$PKG_NAME" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          security delete-keychain "$keychain"
      - name: Tar
        run: |
          name="$PKG_NAME"
          mkdir dist
          tar -C pkg -czf "dist/$name.tar.gz" "$name"
          otool -L "pkg/$name/VideoSpeedTracker"
      - uses: actions/upload-artifact@v5
        with:
          name: dist-macos-arm64
          path: dist/*
      - name: Attest build provenance
        if: needs.publish.result == 'success'
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.tar.gz
      - name: Add to the release
        if: needs.publish.result == 'success'
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          gh release upload "$TAG" *.tar.gz --clobber
          gh release download "$TAG" --pattern SHA256SUMS
          grep -v -- '-macos-' SHA256SUMS > SHA256SUMS.new || true
          shasum -a 256 *.tar.gz >> SHA256SUMS.new
          mv SHA256SUMS.new SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber

  publish:
    needs: [meta, linux, windows]
    if: needs.meta.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # Sigstore signing for the provenance attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      # Signed SLSA provenance for every package, tying each file's digest to this workflow run,
      # commit and tag; verify with `gh attestation verify <file> -R joekiller/VideoSpeedTracker`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.deb
            dist/*.zip
      - name: Create or update the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: |
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" * --clobber
          else
            gh release create "$TAG" * --verify-tag --generate-notes --title "$TAG"
          fi
