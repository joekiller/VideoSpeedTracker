# Builds every release binary and attaches it to a GitHub release.
#
# Cut a release by pushing a version tag:   git tag v1.0.0 && git push origin v1.0.0
# or from the web page with Actions > cut-release > Run workflow (cut-release.yml tags main and starts this).
# Don't publish the release in the GitHub UI first: immutable releases lock a published release, so this
# workflow could never upload to it (meta stops early with a message if it finds one). A saved draft is fine.
# The release is created with generated notes if it doesn't exist yet, otherwise the
# assets are uploaded to it, replacing any with the same name.
#
# Main pushes that touch the build run everything except the publish step, so a broken platform shows up
# before the tag does (main's run also keeps the OpenCV caches warm). Pull requests don't run the Linux .deb matrix
# (build.yml's single Linux job covers Linux), but they do run this workflow's own windows and macos jobs:
# platform-windows.yml and platform-macos.yml call it (workflow_call) with linux: false and the other platform off,
# each only when the PR touches files that platform builds. Same steps as a release, so a PR's Windows or Mac result
# is the release's, without signing (no tag, no secrets passed) and without publishing (no tag). To run the full
# matrix on a branch anyway, start this workflow by hand (Actions > release > Run workflow, or
# `gh workflow run release.yml --ref <branch>`); a manual run on a tag also publishes.
#
# Every package holds VideoSpeedTracker, ProcessHiLites and the VST Studio desktop app (VSTStudio) plus
# their sample configs. VST Studio's own dependencies (GLFW, Dear ImGui, fonts, ...) are fetched by CMake at
# configure time and linked statically, so the packages need nothing new at run time.
# Outputs (all on OpenCV 5 and checked with the sample-video ctest):
#   videospeedtracker_<ver>_<distro>_<arch>.deb  Debian 12/13 (incl. Raspberry Pi OS) and Ubuntu
#                                                24.04/26.04 LTS, amd64 + arm64; OpenCV linked in
#                                                statically, apt pulls in the distro's FFmpeg and GTK
#                                                runtimes
#   VideoSpeedTracker-<ver>-windows-x64-setup.exe  installer of the same files: Start-menu "VST Studio",
#                                                per-user or all-users, signed like the exes (packaging/windows)
#   VideoSpeedTracker-<ver>-windows-x64.zip      exes (static OpenCV) + FFmpeg plugin/MSVC runtime DLLs
#                                                and their licenses
#   VideoSpeedTracker-<ver>-macos-arm64.dmg      VSTStudio.app (drag to Applications) + the command-line tools;
#                                                signed, notarized and stapled on tags
#   VideoSpeedTracker-<ver>-macos-arm64.tar.gz   the same files; both need `brew install opencv` (Homebrew's 5.x)
# Linux and Windows build OpenCV from source with packaging/build-opencv.sh; the install is
# cached per platform, so only the first run (or a change to that script) pays for the build.
#   SHA256SUMS                                   sha256 of every package above
#   SHA256SUMS.sigstore.json                     Sigstore bundle signing SHA256SUMS (offline verification)
# Chain of custody (README "Verifying a download"): each package gets a GitHub artifact attestation, i.e.
# Sigstore-signed SLSA build provenance binding its sha256 to this workflow, commit and tag. The release stays
# a draft until every platform is uploaded; the checksums job then hashes what the release actually holds,
# attests SHA256SUMS too and only then publishes, so a release is never public half-filled or with unsigned
# checksums, and it works with GitHub's immutable releases (assets locked once published).
name: release

on:
  push:
    tags: ['v[0-9]*']
    # Main runs too, for the same paths: Actions caches are scoped to the ref that saved them, and a
    # branch or tag can only restore its own or the default branch's. Without a main run nothing ever
    # saved the OpenCV builds where tags and manual branch runs could see them (4-6 min a job to rebuild).
    # Path filters don't apply to tag pushes, so releases still always build.
    branches: [main]
    # Only what changes a package or its tests; docs and the companion don't.
    paths:
      - .github/workflows/release.yml
      - CMakeLists.txt
      - bin/**
      - cmake/**
      - packaging/**
      - sampleData/**
      - src/**
      - tests/**
  workflow_dispatch:
  # Pull requests' Windows and Mac checks (platform-windows.yml, platform-macos.yml). Each input turns one platform's
  # build job off; push and manual runs have no inputs, so `inputs.<platform> != false` is true and everything runs.
  workflow_call:
    inputs:
      linux:
        type: boolean
        default: true
      windows:
        type: boolean
        default: true
      macos:
        type: boolean
        default: true

permissions:
  contents: read

# A newer push to the same branch supersedes its running build; tag builds always finish. github.workflow is the
# caller's name when called, so a PR's Windows and Mac runs (same ref) don't cancel each other.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
    steps:
      # Tag builds are versioned from the tag (v1.2.3 -> 1.2.3); anything else gets a
      # dpkg-sortable pre-release version (0.0.0~abc1234) and is never published.
      - id: v
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          version="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${version:-0.0.0~${GITHUB_SHA::7}}" >> "$GITHUB_OUTPUT"
      # A release published before its assets is locked by immutable releases (HTTP 422 on upload), so say so now
      # rather than after ten minutes of builds.
      - name: Check the release isn't already published
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$draft" = false ]; then
            echo "::error::Release $TAG is already published, so its assets are locked. Delete it and release the next version with a tag push or Actions > cut-release, without publishing it in the UI."
            exit 1
          fi

  linux:
    needs: meta
    if: inputs.linux != false
    name: linux ${{ matrix.distro }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # One .deb per distro release because each ships different FFmpeg/GTK sonames
        # (OpenCV itself is static). arm64 builds run natively on GitHub's arm runners and
        # cover 64-bit Raspberry Pi OS.
        distro: [debian-bookworm, debian-trixie, ubuntu-24.04, ubuntu-26.04]
        arch: [amd64, arm64]
        include:
          - distro: debian-bookworm
            image: debian:bookworm
          - distro: debian-trixie
            image: debian:trixie
          - distro: ubuntu-24.04
            image: ubuntu:24.04
          - distro: ubuntu-26.04
            image: ubuntu:26.04
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Install toolchain and OpenCV's build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Mirrors occasionally drop a connection; apt retries each fetch instead of failing the job.
          echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80-retries
          # The container is thrown away after the job, so dpkg can skip its fsyncs and the docs and man pages.
          printf '%s\n' force-unsafe-io 'path-exclude=/usr/share/doc/*' 'path-exclude=/usr/share/man/*' \
            'path-include=/usr/share/doc/*/copyright' > /etc/dpkg/dpkg.cfg.d/90-ci
          # Some 2,000 lines of unpack/setup chatter go to a log that is printed only if the install fails.
          apt-get -qq update
          apt-get install -y -qq -o Dpkg::Use-Pty=0 --no-install-recommends ca-certificates git cmake make g++ \
            dpkg-dev file pkg-config zlib1g-dev libpng-dev libjpeg-dev libgtk-3-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            > "$RUNNER_TEMP/apt.log" 2>&1 || { cat "$RUNNER_TEMP/apt.log"; exit 1; }
          cmake --version | head -1; g++ --version | head -1
      - uses: actions/checkout@v7
      - name: Cache OpenCV
        id: opencv-cache
        uses: actions/cache@v6
        with:
          path: /opt/opencv
          key: opencv-5.0.0-${{ matrix.distro }}-${{ matrix.arch }}-${{ hashFiles('packaging/build-opencv.sh') }}
      - name: Build OpenCV
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: packaging/build-opencv.sh /opt/opencv
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/opt/opencv \
                -DVST_VERSION=${{ needs.meta.outputs.version }}
          cmake --build build -j"$(nproc)"
      # Independent tests run side by side; min_logged_speed_0/_30 still wait for sample_video_baseline (fixture).
      - name: Sample video regression test
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"
      - name: Package
        run: |
          (cd build && cpack -G DEB)
          mkdir dist
          cp build/videospeedtracker_*.deb \
             "dist/videospeedtracker_${{ needs.meta.outputs.version }}_${{ matrix.distro }}_${{ matrix.arch }}.deb"
          dpkg-deb --info dist/*.deb
      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux-${{ matrix.distro }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 7    # tag builds publish to the release; the artifact is only a hand-off
          compression-level: 0 # .deb/.zip/.tar.gz are compressed already; deflating them again only costs time

  windows:
    needs: meta
    if: inputs.windows != false
    runs-on: windows-2022
    # Tag builds run in the `release` environment, so their OIDC subject is
    # repo:<owner>/<repo>:environment:release, the one subject Azure's federated credential has to match
    # (a Tag credential would need one per tag name). Other builds use no environment and don't sign.
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    permissions:
      contents: read
      id-token: write      # OIDC login to Azure for Artifact Signing
    env:
      # Authenticode signing runs on tag builds once the Azure Artifact Signing secrets/variables are set
      # (see docs/code-signing.md); without them the zip ships unsigned as before. Main and manual
      # builds are never published, and their OIDC subjects don't match the tag-scoped federated credential.
      SIGN_WINDOWS: ${{ github.ref_type == 'tag' && secrets.AZURE_CLIENT_ID != '' && vars.AZURE_SIGNING_ACCOUNT != '' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      # Static OpenCV 5; videoio loads FFmpeg from OpenCV's prebuilt opencv_videoio_ffmpeg plugin DLL.
      - name: Cache OpenCV
        id: opencv-cache
        uses: actions/cache@v6
        with:
          path: C:\opencv
          key: opencv-5.0.0-windows-x64-${{ hashFiles('packaging/build-opencv.sh') }}
      - name: Build OpenCV
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        shell: bash
        run: packaging/build-opencv.sh C:/opencv
      - name: Locate the FFmpeg plugin
        run: |
          $dll = Get-ChildItem C:\opencv -Recurse -File -Filter 'opencv_videoio_ffmpeg*_64.dll' | Select-Object -First 1
          if (-not $dll) { throw "opencv_videoio_ffmpeg DLL not found under C:\opencv" }
          "FFMPEG_DLL=$($dll.FullName)" | Out-File -Append $env:GITHUB_ENV
          $dll.DirectoryName | Out-File -Append $env:GITHUB_PATH
      - name: Build
        run: |
          # OpenCV's Windows config picks shared libs unless told otherwise. The -D values are quoted
          # because pwsh splits an unquoted 0.0.0~sha at the first dot.
          cmake -S . -B build -A x64 -DCMAKE_PREFIX_PATH=C:/opencv -DOpenCV_STATIC=ON "-DVST_VERSION=${{ needs.meta.outputs.version }}"
          # --parallel lets MSBuild build independent projects at once; /MP (CMakeLists.txt) parallelizes inside each.
          cmake --build build --config Release --parallel
      - name: Sample video regression test
        run: ctest --test-dir build -C Release --output-on-failure -j $env:NUMBER_OF_PROCESSORS
      - name: Stage package
        run: |
          $name = "VideoSpeedTracker-${{ needs.meta.outputs.version }}-windows-x64"
          "PKG_NAME=$name" | Out-File -Append $env:GITHUB_ENV
          # The install step adds OpenCV's LICENSE and third-party notices (incl. FFmpeg's LGPL-2.1
          # for the plugin DLL) under licenses/opencv.
          cmake --install build --config Release --prefix "pkg/$name"
          Copy-Item $env:FFMPEG_DLL "pkg/$name"
          if (-not (Test-Path "pkg/$name/licenses/opencv/LICENSE")) { throw "OpenCV LICENSE missing from the package" }
          Get-ChildItem "pkg/$name/licenses/opencv"
      - name: Azure login
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          # The signing identity only holds a role on the Artifact Signing account, not on a subscription,
          # so az sees no subscriptions; signing needs just the token, not a subscription context.
          allow-no-subscriptions: true
      # Signs only our exes; the OpenCV DLLs are third-party and the MSVC runtime is Microsoft-signed.
      - name: Authenticode-sign the executables
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\pkg\${{ env.PKG_NAME }}
          files-folder-filter: exe
          # Shown as the program name (and its link) in the UAC prompt instead of the bare file name.
          description: VideoSpeedTracker
          description-url: https://github.com/joekiller/VideoSpeedTracker
          # azure/login leaves an Azure CLI session; skip the environment credential that DefaultAzureCredential
          # would otherwise try first.
          exclude-environment-credential: true
          # Signing runs only on tags, and a tag can restore only its own or main's caches, so the action's
          # cache of its tools (saved under this tag) would never be read again. The tools stay on disk for the
          # installer's signing step below either way.
          cache-dependencies: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      - name: Zip
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Compress-Archive -Path "pkg/$env:PKG_NAME" -DestinationPath "dist/$env:PKG_NAME.zip"
          Get-ChildItem "pkg/$env:PKG_NAME" | Format-Table Mode, Length, Name -AutoSize
          Get-AuthenticodeSignature "pkg/$env:PKG_NAME/*.exe" |
            Format-Table Status, @{ n = 'Signer'; e = { $_.SignerCertificate.Subject } }, Path -AutoSize
          Get-Item "dist/$env:PKG_NAME.zip" | Format-Table Length, Name -AutoSize
      # The installer (packaging/windows/vst-setup.iss) wraps the same, already signed, files. Inno Setup 6 comes
      # with the windows-2022 image. Its version resource needs digits only, so a 0.0.0~sha build is 0.0.0.
      - name: Build the installer
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup 6 isn't installed on this runner" }
          $ver = "${{ needs.meta.outputs.version }}"
          $numeric = ($ver -split '[^0-9.]')[0]
          & $iscc /Qp "/DSourceDir=$PWD\pkg\$env:PKG_NAME" "/DAppVersion=$ver" "/DNumericVersion=$numeric" "/DOutputDir=$PWD\installer" packaging\windows\vst-setup.iss
          if ($LASTEXITCODE) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-ChildItem installer
      - name: Authenticode-sign the installer
        if: env.SIGN_WINDOWS == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\installer
          files-folder-filter: exe
          description: VideoSpeedTracker setup
          description-url: https://github.com/joekiller/VideoSpeedTracker
          exclude-environment-credential: true
          cache-dependencies: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
      # Install silently for the current user into a scratch folder, check the files, the Start-menu shortcut and
      # that VST Studio starts, then uninstall and check it's gone (and that it left the user's config alone).
      - name: Test the installer
        run: |
          $setup = Get-ChildItem installer\*-setup.exe | Select-Object -First 1
          $dir = "$env:RUNNER_TEMP\vst-install"
          $p = Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$dir`"", "/LOG=`"$env:RUNNER_TEMP\setup.log`"" -Wait -PassThru
          if ($p.ExitCode) { Get-Content "$env:RUNNER_TEMP\setup.log"; throw "setup exited with $($p.ExitCode)" }
          foreach ($f in 'VSTStudio.exe', 'VideoSpeedTracker.exe', 'ProcessHiLites.exe', 'VST.cfg', 'LICENSE.txt', 'sample\manual_20160130172251.avi', 'companion\index.html') {
            if (-not (Test-Path "$dir\$f")) { throw "$f wasn't installed" }
          }
          if (-not (Get-ChildItem "$dir\opencv_videoio_ffmpeg*.dll")) { throw "the FFmpeg plugin wasn't installed" }
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\VST Studio.lnk"
          if (-not (Test-Path $lnk)) { throw "no Start-menu shortcut at $lnk" }
          $sc = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk)
          if ($sc.TargetPath -ne "$dir\VSTStudio.exe") { throw "the shortcut points at $($sc.TargetPath)" }
          if ($sc.WorkingDirectory -ne $env:USERPROFILE) { throw "the shortcut starts in $($sc.WorkingDirectory), not the home folder" }
          # The GUI has no window to show on a runner, but it must at least load (all DLLs present) and stay up.
          $app = Start-Process "$dir\VSTStudio.exe" -WorkingDirectory $env:USERPROFILE -PassThru
          Start-Sleep -Seconds 5
          if ($app.HasExited -and $app.ExitCode -eq -1073741515) { throw "VSTStudio.exe is missing a DLL" }
          if (-not $app.HasExited) { Stop-Process $app -Force }
          New-Item -ItemType Directory -Force "$env:APPDATA\VideoSpeedTracker" | Out-Null
          "kept" | Out-File "$env:APPDATA\VideoSpeedTracker\uninstall-test.txt"
          Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait
          # The uninstaller hands off to a copy of itself in %TEMP%, so wait for the files to go.
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\VSTStudio.exe"); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path "$dir\VSTStudio.exe") { throw "uninstall left VSTStudio.exe behind" }
          if (Test-Path $lnk) { throw "uninstall left the Start-menu shortcut" }
          if (-not (Test-Path "$env:APPDATA\VideoSpeedTracker\uninstall-test.txt")) { throw "uninstall removed the user's config folder" }
          Copy-Item $setup.FullName dist/
      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows-x64
          path: dist/*
          retention-days: 7    # tag builds publish to the release; the artifact is only a hand-off
          compression-level: 0 # .deb/.zip/.tar.gz are compressed already; deflating them again only costs time

  # macOS builds alongside the others but doesn't gate the release: GitHub's macOS pool is small and
  # its runners can sit queued far longer, so publish goes ahead without it and macos-release adds the
  # tarball and checksum to the existing release afterwards. Uploading runs on Linux, so the macOS
  # runner (billed at 10x) is held only for the build itself.
  # macos-latest follows GitHub's current Apple-silicon image, so macOS retirements need no edits here (the
  # package is built against Homebrew's OpenCV of the day either way). Linux and Windows stay pinned: their
  # .deb dependencies and MSVC toolset are tied to the image.
  macos:
    needs: meta
    if: inputs.macos != false
    runs-on: macos-latest
    # The Apple secrets live in the `release` environment, which only tag builds enter (same rule as windows);
    # without it secrets.* resolve empty and SIGN_MACOS is false even on a tag.
    environment: ${{ github.ref_type == 'tag' && 'release' || '' }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      # Not HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: Homebrew answers it with a ##[warning] annotation on every run.
      # Developer ID signing + notarization runs on tag builds once the Apple secrets are set (see
      # docs/code-signing.md); without them the binaries keep the linker's ad-hoc signature.
      # Unpublished main and manual builds skip it rather than wait on Apple's notary service.
      SIGN_MACOS: ${{ github.ref_type == 'tag' && secrets.MACOS_CERT_P12_BASE64 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install OpenCV
        # Homebrew has no retry option, so a failed bottle download gets two more tries.
        run: for i in 1 2 3; do brew install opencv && exit 0; sleep $((i * 15)); done; exit 1
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix opencv)" \
                -DVST_VERSION=${{ needs.meta.outputs.version }}
          cmake --build build -j"$(sysctl -n hw.ncpu)"
      - name: Sample video regression test
        run: ctest --test-dir build --output-on-failure -j"$(sysctl -n hw.ncpu)"
      # Links against Homebrew's OpenCV dylibs rather than bundling them (that would drag in
      # FFmpeg and most of its codec stack), so the archive is for machines with Homebrew.
      - name: Stage package
        run: |
          name="VideoSpeedTracker-${{ needs.meta.outputs.version }}-macos-arm64"
          echo "PKG_NAME=$name" >> "$GITHUB_ENV"
          cmake --install build --prefix "pkg/$name"
          printf 'Requires Homebrew OpenCV 5:  brew install opencv\n' > "pkg/$name/REQUIREMENTS.txt"
          # VST Studio ships as VSTStudio.app: Gatekeeper won't pass a double-clicked bare executable even when it's
          # notarized, and only a bundle can carry a stapled ticket. Its resources (companion, sample, VST.cfg
          # template) go inside the bundle, because a quarantined app is translocated alone on first launch; the
          # command-line tools beside it find the sample there too (userpaths::installedFile).
          app="pkg/$name/VSTStudio.app/Contents"
          mkdir -p "$app/MacOS" "$app/Resources"
          mv "pkg/$name/VSTStudio" "$app/MacOS/"
          mv "pkg/$name/companion" "pkg/$name/sample" "$app/Resources/"
          cp "pkg/$name/VST.cfg" "$app/Resources/"
          sed 's/@VERSION@/${{ needs.meta.outputs.version }}/g' packaging/macos-Info.plist > "$app/Info.plist"
          plutil -lint "$app/Info.plist"
          iconset="$RUNNER_TEMP/VSTStudio.iconset"
          mkdir -p "$iconset"
          for s in 16 32 128 256; do
            sips -z $s $s packaging/vst-studio.png --out "$iconset/icon_${s}x${s}.png" >/dev/null
            if [ $s -le 128 ]; then
              sips -z $((s * 2)) $((s * 2)) packaging/vst-studio.png --out "$iconset/icon_${s}x${s}@2x.png" >/dev/null
            fi
          done
          iconutil -c icns "$iconset" -o "$app/Resources/VSTStudio.icns"
          # Seal the bundle (Info.plist and resources) with an ad-hoc signature; tag builds re-sign it below.
          codesign --force --sign - "pkg/$name/VSTStudio.app"
      # Hardened runtime is required for notarization; the entitlements let it load Homebrew's
      # OpenCV dylibs, which aren't signed by our team, and use the camera. The ticket is stapled to
      # VSTStudio.app so it opens offline; the bare command-line tools can't be stapled, so Gatekeeper
      # looks theirs up online the first time they run.
      - name: Sign and notarize
        if: env.SIGN_MACOS == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kc_pass="$(uuidgen)"
          security create-keychain -p "$kc_pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kc_pass" "$keychain"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pass" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN=$keychain" >> "$GITHUB_ENV"   # the disk image is signed with it after packaging
          # Signing the bundle signs Contents/MacOS/VSTStudio and seals Info.plist and Resources with it.
          for exe in VideoSpeedTracker ProcessHiLites VSTStudio.app; do
            codesign --force --timestamp --options runtime \
              --entitlements packaging/macos-entitlements.plist \
              --sign "Developer ID Application" --keychain "$keychain" "pkg/$PKG_NAME/$exe"
            codesign --verify --deep --strict --verbose=2 "pkg/$PKG_NAME/$exe"
          done
          ditto -c -k --keepParent "pkg/$PKG_NAME" "$RUNNER_TEMP/notarize.zip"
          # notarytool exits 0 on an Invalid verdict too, so check the status it reports.
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --wait --output-format json \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" | tee "$RUNNER_TEMP/notary.json"
          grep -q '"status" *: *"Accepted"' "$RUNNER_TEMP/notary.json"
          xcrun stapler staple "pkg/$PKG_NAME/VSTStudio.app"
          # What a user's Mac will decide: the app must read "accepted, source=Notarized Developer ID". The tools'
          # verdict depends on an online ticket lookup, so it's printed for the log rather than gating the release.
          spctl --assess --type execute --verbose=4 "pkg/$PKG_NAME/VSTStudio.app"
          for exe in VideoSpeedTracker ProcessHiLites; do
            spctl --assess --type install --verbose=4 "pkg/$PKG_NAME/$exe" || true
          done
      # The disk image is built from the already signed and stapled files, so the app inside it opens
      # offline; Applications is a symlink to drag VSTStudio.app onto (it carries everything it needs).
      - name: Tar and disk image
        run: |
          name="$PKG_NAME"
          mkdir dist
          tar -C pkg -czf "dist/$name.tar.gz" "$name"
          otool -L "pkg/$name/VideoSpeedTracker"
          dmgroot="$RUNNER_TEMP/dmgroot"
          ditto "pkg/$name" "$dmgroot"
          ln -s /Applications "$dmgroot/Applications"
          hdiutil create -volname "VideoSpeedTracker ${{ needs.meta.outputs.version }}" -srcfolder "$dmgroot" \
            -fs HFS+ -format UDZO -ov "dist/$name.dmg"
      # A second notarization, of the image itself, so its ticket can be stapled to the .dmg too.
      - name: Sign and notarize the disk image
        if: env.SIGN_MACOS == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          dmg="dist/$PKG_NAME.dmg"
          codesign --force --timestamp --sign "Developer ID Application" --keychain "$KEYCHAIN" "$dmg"
          xcrun notarytool submit "$dmg" --wait --output-format json \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" | tee "$RUNNER_TEMP/notary-dmg.json"
          grep -q '"status" *: *"Accepted"' "$RUNNER_TEMP/notary-dmg.json"
          xcrun stapler staple "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          security delete-keychain "$KEYCHAIN"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos-arm64
          path: dist/*
          retention-days: 7    # tag builds publish to the release; the artifact is only a hand-off
          compression-level: 0 # .deb/.zip/.tar.gz are compressed already; deflating them again only costs time

  publish:
    needs: [meta, linux, windows]
    if: needs.meta.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write      # Sigstore signing for the provenance attestations
      attestations: write
    steps:
      # Linux and Windows only. When macOS happened to finish first its tarball used to come along too and be
      # uploaded (unattested) here, then again by macos-release.
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-{linux,windows}-*
          merge-multiple: true
          path: dist
      # Signed SLSA provenance for every package, tying each file's digest to this workflow run,
      # commit and tag; verify with `gh attestation verify <file> -R joekiller/VideoSpeedTracker`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.deb
            dist/*.zip
            dist/*.exe
      - name: Create or update the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
        # A new release starts as a draft; the checksums job publishes it once macOS is in and SHA256SUMS is
        # signed. A release that already exists (made in the UI, or a re-run) just gets the files replaced;
        # if it is already published under immutable releases that upload is refused, so make UI releases
        # as drafts.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" * --clobber
          else
            gh release create "$TAG" * --draft --verify-tag --generate-notes --title "$TAG"
          fi

  macos-release:
    needs: [meta, publish, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write      # Sigstore signing for the provenance attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-macos-arm64
          path: dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*
      - name: Add to the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.meta.outputs.tag }}
        run: gh release upload "$TAG" *.dmg *.tar.gz --clobber

  # Last step of a tag build: sign the checksum list and make the release public. It needs every platform, so a
  # failed macOS build leaves the release a draft; "Re-run failed jobs" finishes it, or publish it by hand.
  checksums:
    needs: [meta, publish, macos-release]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write      # Sigstore signing for the SHA256SUMS attestation
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.meta.outputs.tag }}
    steps:
      # GitHub records a sha256 for each stored release asset, so this hashes exactly what users will download
      # (stale files from an earlier run included) without fetching ~1 GB. The releases list, unlike
      # releases/tags/<tag>, also returns drafts. Our own SHA256SUMS* from a re-run are left out; an asset
      # without a digest fails the job rather than going unlisted.
      - name: Write SHA256SUMS from the release's asset digests
        run: |
          gh api "repos/$GH_REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .assets[] | select(.name | startswith(\"SHA256SUMS\") | not)
                  | \"\\(.digest // \"MISSING\")  \\(.name)\"" |
            sed 's/^sha256://' | sort -k2 > SHA256SUMS
          cat SHA256SUMS
          test -s SHA256SUMS
          if grep -q '^MISSING ' SHA256SUMS; then echo "::error::asset without a digest"; exit 1; fi
      - name: Attest SHA256SUMS
        id: attest
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: SHA256SUMS
      # The attestation also lives in GitHub's attestation store; the bundle copy lets anyone verify the
      # checksums later, or somewhere GitHub's API isn't reachable (gh attestation verify --bundle, or cosign).
      - name: Upload SHA256SUMS and its signature, then publish
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" SHA256SUMS.sigstore.json
          gh release upload "$TAG" SHA256SUMS SHA256SUMS.sigstore.json --clobber
          gh release edit "$TAG" --draft=false
