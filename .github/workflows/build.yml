name: build

# Pushes to master and pull requests only: a push to a PR branch used to start a second, identical run
# next to the pull_request one.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to a PR supersedes its running build; master builds always finish.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The phone companion's unit and contract tests (against the mock server). Plain `node --test`, no npm
      # install: the runner image's preinstalled Node is enough as long as it is 20 or newer.
      - name: Companion tests
        run: |
          node --version
          node -e 'process.exit(+process.versions.node.split(".")[0] >= 20 ? 0 : 1)' || { echo "::error::Node 20+ needed"; exit 1; }
          node --test companion/test/*.test.mjs
      - name: Install OpenCV and the X11/OpenGL headers VST Studio needs
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          # Most of this step used to be dpkg: rebuilding the man-db index after every package and fsyncing each
          # file of a runner that is discarded afterwards. Skip both, and leave out Recommends (except Mesa's software
          # OpenGL, which Xvfb needs for VST Studio's GL 3.2 context).
          sudo rm -f /var/lib/man-db/auto-update
          echo force-unsafe-io | sudo tee /etc/dpkg/dpkg.cfg.d/90-ci >/dev/null
          # The unpack/setup chatter (about 2,000 lines) goes to a log that is printed only if the install fails.
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq -o Dpkg::Use-Pty=0 --no-install-recommends \
            libopencv-dev libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            xvfb libgl1-mesa-dri \
            > "$RUNNER_TEMP/apt.log" 2>&1 || { cat "$RUNNER_TEMP/apt.log"; exit 1; }
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j"$(nproc)"
      # Sample video regression, config parsing, first run, and the companion API smoke test, which drives VST
      # Studio under Xvfb (xvfb installed above; curl and Node come with the runner). VST_REQUIRE_API_SMOKE makes
      # that test fail rather than skip if anything it needs goes missing. Independent tests run side by side
      # (min_logged_speed still waits for sample_video_baseline, whose output it reads).
      - name: Tests
        env:
          VST_REQUIRE_API_SMOKE: 1
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"
      - name: Upload the API smoke test's logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-smoke-logs
          path: |
            build/api-smoke/*.log
            build/api-smoke/*.txt
          if-no-files-found: ignore
      # Drives every page of the desktop app on the sample video under a virtual display and saves a screenshot
      # of each, so a broken page shows up here and the README images can be refreshed from the artifact.
      - name: VST Studio screenshot tour
        run: xvfb-run -a -s "-screen 0 1600x980x24" build/src/Gui/VSTStudio --config bin/VST.cfg --shots shots
      # The tour exits non-zero when a step times out or nothing was tracked; keep its screenshots either way.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: vst-studio-screenshots
          path: shots/*.png
