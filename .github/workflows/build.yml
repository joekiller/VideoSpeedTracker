name: build

# Pushes to master and pull requests only: a push to a PR branch used to start a second, identical run
# next to the pull_request one.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to a PR supersedes its running build; master builds always finish.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenCV
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j
      - name: Sample video regression test
        run: ctest --test-dir build --output-on-failure
