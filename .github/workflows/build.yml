name: build

# Pull requests' Linux check: a single Linux build and test job against the distro's OpenCV. Windows and macOS get
# their own checks (platform-windows.yml, platform-macos.yml); the Linux .deb matrix (release.yml) runs after merge,
# on main, and locally .githooks/pre-commit runs the same build and tests before each commit. Pushes to main and pull requests only: a push to a PR branch used to
# start a second, identical run next to the pull_request one.
#
# Only changes that can affect the build, the tests or the companion start a run; docs, README and release-only
# packaging edits don't. With no matching files the check doesn't run at all, so don't make it a required check.
on:
  push:
    branches: [main]
    paths: &paths
      - .github/workflows/build.yml
      - CMakeLists.txt
      - bin/**
      - cmake/**
      - companion/**
      - sampleData/**
      - src/**
      - tests/**
  pull_request:
    paths: *paths
  workflow_dispatch:

# A new push to a PR supersedes its running build; main builds always finish.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The phone companion's unit and contract tests (against the mock server). Plain `node --test`, no npm
      # install: the runner image's preinstalled Node is enough as long as it is 20 or newer.
      - name: Companion tests
        run: |
          node --version
          node -e 'process.exit(+process.versions.node.split(".")[0] >= 20 ? 0 : 1)' || { echo "::error::Node 20+ needed"; exit 1; }
          node --test companion/test/*.test.mjs
      - name: Install OpenCV and the X11/OpenGL headers VST Studio needs
        run: |
          echo 'Acquire::Retries "5";' | sudo tee /etc/apt/apt.conf.d/80-retries >/dev/null
          # Most of this step used to be dpkg: rebuilding the man-db index after every package and fsyncing each
          # file of a runner that is discarded afterwards. Skip both, and leave out Recommends (except Mesa's software
          # OpenGL, which Xvfb needs for VST Studio's GL 3.2 context).
          sudo rm -f /var/lib/man-db/auto-update
          echo force-unsafe-io | sudo tee /etc/dpkg/dpkg.cfg.d/90-ci >/dev/null
          # The unpack/setup chatter (about 2,000 lines) goes to a log that is printed only if the install fails.
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq -o Dpkg::Use-Pty=0 --no-install-recommends \
            libopencv-dev libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            xvfb libgl1-mesa-dri \
            > "$RUNNER_TEMP/apt.log" 2>&1 || { cat "$RUNNER_TEMP/apt.log"; exit 1; }
      # VST_WERROR: a new compiler warning in our code fails the PR rather than piling up in release logs.
      - name: Build
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVST_WERROR=ON && cmake --build build -j"$(nproc)"
      # Sample video regression, config parsing, first run, the windows.h macro check (portability_windows_macros), and
      # the companion API smoke test, which drives VST
      # Studio under Xvfb (xvfb installed above; curl and Node come with the runner). VST_REQUIRE_API_SMOKE makes
      # that test fail rather than skip if anything it needs goes missing. Independent tests run side by side
      # (the min_logged_speed_* pair still waits for sample_video_baseline, whose output it reads).
      - name: Tests
        env:
          VST_REQUIRE_API_SMOKE: 1
        run: ctest --test-dir build --output-on-failure -j"$(nproc)"
      - name: Upload the API smoke test's logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-smoke-logs
          path: |
            build/api-smoke/*.log
            build/api-smoke/*.txt
          if-no-files-found: ignore
      # Drives every page of the desktop app on the sample video under a virtual display and saves a screenshot
      # of each, so a broken page shows up here and the README images can be refreshed from the artifact.
      - name: VST Studio screenshot tour
        run: xvfb-run -a -s "-screen 0 1600x980x24" build/src/Gui/VSTStudio --config bin/VST.cfg --shots shots
      # The tour exits non-zero when a step times out or nothing was tracked; keep its screenshots either way.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: vst-studio-screenshots
          path: shots/*.png

  # Pull requests build only against the distro's OpenCV 4, while every release links OpenCV 5, which deprecates APIs
  # 4 still takes quietly (PR #43 removed 18 such warnings found in main's release logs).  This compiles every source,
  # syntax only, against the OpenCV 5 that release.yml builds and caches on main, with deprecations as errors
  # (tests/portability_check.py).  It reuses that cache rather than building OpenCV, so it costs about two minutes;
  # in the same container image as the release job so the cache entry matches.  If main hasn't saved one yet (a
  # change to packaging/build-opencv.sh), it says so and passes.
  opencv5-headers:
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    steps:
      - name: Install the compiler and VST Studio's build headers
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80-retries
          printf '%s\n' force-unsafe-io 'path-exclude=/usr/share/doc/*' 'path-exclude=/usr/share/man/*' > /etc/dpkg/dpkg.cfg.d/90-ci
          apt-get -qq update
          apt-get install -y -qq -o Dpkg::Use-Pty=0 --no-install-recommends ca-certificates git cmake make g++ python3 \
            pkg-config libgl-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            > "$RUNNER_TEMP/apt.log" 2>&1 || { cat "$RUNNER_TEMP/apt.log"; exit 1; }
      - uses: actions/checkout@v7
      - name: Restore main's OpenCV 5 build
        id: opencv
        uses: actions/cache/restore@v6
        with:
          path: /opt/opencv
          key: opencv-5.0.0-ubuntu-24.04-amd64-${{ hashFiles('packaging/build-opencv.sh') }}
      - name: Compile every source against OpenCV 5's headers
        run: |
          if [ "${{ steps.opencv.outputs.cache-hit }}" != true ]; then
            echo "::notice::No OpenCV 5 build cached on main for this build-opencv.sh yet; skipped (main's release run saves one)."
            exit 0
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/opt/opencv
          python3 tests/portability_check.py build . --opencv5 /opt/opencv
