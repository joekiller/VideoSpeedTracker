dataPathPrefix = g:\locustdata  # path to data directories, IPCam, Stats, etc.   Use single back-slashes on Windows.  Exactly these three lines, in this order.
CropLeft = 320		# How much to crop off left side of full frame for analysis box.  Want to keep this small (zero!) if possible
CropTop = 120		# How much to crop off top of full frame to get rid of tree tops, across-the-street houses, etc.