# VideoSpeedTracker settings: one "key = value" per line, in any order; text after # is a comment.
# Keys left out keep their built-in defaults.  Pixel values are in 1280x720 frame coordinates (other video sizes are scaled).
# Every key is described in the appendix of docs/Video Speed Tracker Overview and User Manual.md.
#
# As shipped, the geometry and calibration below are for the bundled 2016 Locust Avenue sample video
# (sample/manual_20160130172251.avi; try it with VideoSpeedTracker --demo).  For your own camera, redo the
# analysis box, speed lines, hubcap lines, obstruction, directions and calibration: see GETTING-STARTED.md.
dataPathPrefix =                # Folder holding IPCam, Stats, Trace and HiLites.  Blank = the per-user data folder (see README).  Plain single back-slashes on Windows.
L2RDirection = "SE"			# Compass direction L2R vehicles are heading (a label in the stats; sample: SE)
R2LDirection = "NW"			# Compass direction R2L vehicles are heading (sample: NW)
obstruction = [251,311]		# Left / right x coords bounding vertical obstructions in foreground.  Max 2. Relative to AnalysisBoxLeft. ...pixels
AnalysisBoxLeft = 10		# How much to crop off left side of full frame for analysis box.  Want to keep this small (zero!) if possible
AnalysisBoxTop = 220		# How much to crop off top of full frame to get rid of tree tops, across-the-street houses, etc.
AnalysisBoxWidth = 1269		# Width of Analysis Box relative to AnalysisBoxLeft.  Their sum must be <= 1279. ...pixels
AnalysisBoxHeight = 190		# Measured down from Analysis Box Top; determines height of Analysis Box.  (Top+Height) <= 719.
speedLineLeft = 350			# x coord of left white line for speed measuring box, realtive to AnalysisBoxLeft
speedLineRight = 909		# x coord of right white line for speed measuring box, realtive to AnalysisBoxLeft
maxL2RDistOnEntry = 75  	# How aggressively tracker should look out in front of *entering* L2R vehicle...pixels
maxR2LDistOnEntry = 75		# How aggressively tracker should look out in front of *entering* R2L vehicle...pixels
entryLookBack = 250			# How far back to look for rear bumper of entering vehicle...pixels
obstruction_extent = 30		# Additional span past obstruction to regain track...pixels
largeVehicleArea = 100		# Threshold for identifying large vehicles.
CalibrationFramesL2R = 35	# Frames a vehicle takes to cross the speed zone L2R at CalibrationSpeed
CalibrationFramesR2L = 40	# Frames a vehicle takes to cross the speed zone R2L at CalibrationSpeed (far lane: usually more than L2R)
CalibrationSpeed = 25		# MPH the calibration vehicle drove when the two CalibrationFrames values were counted
CalibrationFPS = 30		# Frame rate of the video those CalibrationFrames were counted in
SENSITIVITY_VALUE = 30		# Sensitivity value for the OpenCV absdiff funtion. Change with care.
BLUR_SIZE = 20				# To smooth the intensity image output from absdiff() function.  Change with care.
SLOP = 15					# Margin of error when testing for vehicle overlap... pixels.
R2LStreetY = 122			# Hubcap line for R2L vehicles on flat street.  Orange.  Relative to AnalysisBoxTop...pixels
L2RStreetY = 158			# Hubcap line for L2R vehicles on flat street.  Purple.  Relative to AnalysisBoxTop...pixels
nextHeight = 85				# Initial best guess for height of entering vehicles...pixels.
# minLoggedSpeed = 18		# MPH.  Vehicles timed slower than this are counted in the run manifest (run_<name>.json) but get no csv row.  0 = log every timed vehicle.
# levelDegrees = 0		# Camera not mounted level: turn every frame this many degrees counter-clockwise (-15 to 15) so the lanes run straight across.
# subFrameTiming = 0		# 1 for a short view (about 20 ft of street): sub-frame timing, margins scaled by maxL2R/R2LDistOnEntry.  See the manual's appendix.
