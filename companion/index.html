<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VST Companion</title>
  <meta name="description" content="Phone companion for VideoSpeedTracker: live view, recent speeders and wrong-way drivers, remote calibration and sharing.">
  <meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VST">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <a class="brand" href="#/live" aria-label="VST Companion home">
        <img src="icons/icon.svg" alt="" width="28" height="28">
        <span class="brand-text"><b id="site-name">VST</b><small id="site-sub">Companion</small></span>
      </a>
      <button class="conn" id="conn" type="button" aria-live="polite"><i></i><span>Connecting…</span></button>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="tabs" id="tabs" aria-label="Sections">
      <a href="#/live" data-tab="live">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="m16 10 5-3v10l-5-3"/></svg>
        <span>Live</span></a>
      <a href="#/passes" data-tab="passes">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18a8 8 0 1 1 16 0"/><path d="m12 18 4.5-6"/><circle cx="12" cy="18" r="1.4"/></svg>
        <span>Passes</span><b class="badge" id="new-badge" hidden></b></a>
      <a href="#/stats" data-tab="stats">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V11M10 20V5M15 20v-7M20 20V8"/></svg>
        <span>Stats</span></a>
      <a href="#/setup" data-tab="setup">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h12M19 7h2M3 17h2M9 17h12"/><circle cx="17" cy="7" r="2"/><circle cx="7" cy="17" r="2"/></svg>
        <span>Setup</span></a>
      <a href="#/system" data-tab="system">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        <span>System</span></a>
    </nav>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <noscript><p class="noscript">VST Companion needs JavaScript.</p></noscript>
</body>
</html>
