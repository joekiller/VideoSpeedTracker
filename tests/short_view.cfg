# VST.cfg for the short_view test (tests/short_view.cmake): the 2016 Locust Avenue sample cropped to a 20 ft wide window
# and scaled back up, as a stand-in for a camera that sees only about 20 ft of a narrow street.
#
# The crop is x 525..755, y 200..420 of the 1280x720 sample (230x220 pixels; the street is about 11.5 px/ft there, so
# 20 ft), which VST scales to 1280x720: x by 1280/230 = 5.565, y by 720/220 = 3.273.  A car then fills about three
# quarters of the width, as it would from a second-floor window over a 13 ft one-way street.  Every pixel value below is
# the sample's (bin/VST.cfg) moved into the crop and scaled, except where noted.
L2RDirection = "SE"
R2LDirection = "NW"
LegalDirection = NW         # as if NW (R2L) were the one legal way: every SE vehicle is wrong-way
obstruction = [0,0]         # the sample's lamp post is outside the crop
AnalysisBoxLeft = 0
AnalysisBoxTop = 65         # the sample's 220..410 band
AnalysisBoxWidth = 1279
AnalysisBoxHeight = 622
speedLineLeft = 128         # 10% in from each edge: a 16 ft zone in the 20 ft view
speedLineRight = 1151
R2LStreetY = 399
L2RStreetY = 517
nextHeight = 278
maxL2RDistOnEntry = 417     # 75 x 5.565: two frames at about 70 MPH.  subFrameTiming scales its margins by this / 75.
maxR2LDistOnEntry = 417
entryLookBack = 1000        # about a car length (the sample's 250 x 5.565 would be wider than the box)
SLOP = 83
largeVehicleArea = 100
# Calibration: the sample's 35 (L2R) and 40 (R2L) frames at 25 MPH over its 559 px zone, scaled to this zone's 1023 / 5.565
# = 183.8 sample pixels, are 11.51 and 13.15 frames.  The keys are whole numbers, so they are given as the frames at
# 2.5 MPH instead (ten times as many), which is the same calibration.
CalibrationSpeed = 2.5
CalibrationFramesL2R = 115
CalibrationFramesR2L = 132
CalibrationFPS = 30
subFrameTiming = 1
